# viz CI — the fidelity gate + auto-deploy for the interactive illustration layer (CYB-42).
#
# THE PASS (job `fidelity`): the deployed viz JS (viz/index.html) must reproduce the numpy engine
# (src/goodwin_keen/model.py). It extracts the model block from the page and runs it over checkpoints
# generated by the real engine — so a JS drift OR a silent divergence fails the merge. Runs on the
# self-hosted tweedledum runner (label `cybeersym`), unmetered, node-only.
#
# `reference-drift` pins the committed reference (viz/fidelity-reference.json) to model.py; it needs
# numpy, so it runs on GitHub-hosted ubuntu (tweedledum's python has no numpy). Cheap.
#
# `deploy` (push to main only) updates /home/cybeersym on the app box and reloads Caddy. It runs on
# tweedledum because the app box (dev.motormeme.com) is in a private VPC only the local runner reaches;
# it SSHes in with the CYB_DEPLOY_KEY secret.
name: viz

on:
  push:
    branches: [main]
    paths: ["viz/**", "src/goodwin_keen/**", ".github/workflows/viz.yml"]
  pull_request:
    paths: ["viz/**", "src/goodwin_keen/**", ".github/workflows/viz.yml"]

concurrency:
  group: viz-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  fidelity:
    runs-on: [self-hosted, cybeersym]
    steps:
      - uses: actions/checkout@v4
      - name: JS ↔ numpy fidelity (extract model from viz/index.html, verify vs reference)
        run: |
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          node --version
          node viz/verify_fidelity.mjs
      - name: Display-logic regression (the demonstration is actually visible)
        run: |
          export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          node viz/verify_display.mjs

  reference-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy
      - name: reference matches src/goodwin_keen/model.py
        run: python3 viz/gen_reference.py --check

  deploy:
    needs: [fidelity, reference-drift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cybeersym]
    steps:
      - name: Deploy to cybeersym.motormeme.com and reload Caddy
        env:
          DEPLOY_KEY: ${{ secrets.CYB_DEPLOY_KEY }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/cyb_deploy_key"
          ssh -i "$RUNNER_TEMP/cyb_deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            amadsen@dev.motormeme.com \
            'set -e; cd /home/cybeersym && git fetch --quiet origin main && git checkout -q main && git reset --hard -q origin/main && chmod -R a+rX /home/cybeersym/viz && sudo systemctl reload caddy && echo "deployed $(git rev-parse --short HEAD)"'
          rm -f "$RUNNER_TEMP/cyb_deploy_key"
