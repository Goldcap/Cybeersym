# Automated Claude code review — the ADVISORY, low-severity mechanical net.
#
# This is NOT the load-bearing check. The real gate for this project is the domain reviewer gate
# (see CLAUDE.md §"The reviewer gate" and docs/reviewer-gate-log.md): a fresh, independent reviewer
# that RE-DERIVES the math and FACT-CHECKS the economics against the repo's own findings. This
# workflow only catches mechanical issues (obvious bugs, dead code, test gaps). It is tuned to be
# quiet on a deliberately-spartan research repo — see REVIEW.md at the repo root.
#
# Advisory by design: it posts inline comments; it is NOT a required status check (do not add it to
# branch protection). Treat a green run as "no mechanical smell found," never as "this is correct."
#
# PREREQUISITES (manual, done by a repo admin — not committed here):
#   1. Install the Claude GitHub App on this repo (github.com/apps/claude — or run
#      `/install-github-app` from Claude Code, but then DELETE the duplicate workflow it pushes,
#      keeping this tuned one).
#   2. Add a repo secret ANTHROPIC_API_KEY (a Claude API key) or CLAUDE_CODE_OAUTH_TOKEN.
# Until both are in place this workflow no-ops / fails auth harmlessly; it does not block merges.

name: Claude code review (advisory)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Least-privilege: read the code + PR, write inline review comments only.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

# One review per PR at a time; a new push cancels the stale run.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts; the net runs when a PR is actually up for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Either auth works; whichever repo secret is set wins. The OAuth token
          # (CLAUDE_CODE_OAUTH_TOKEN) is the shipped path here; ANTHROPIC_API_KEY is
          # the alternative. An unset one is an empty string the action ignores.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts findings as inline PR comments; scoping/tuning lives in REVIEW.md.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
